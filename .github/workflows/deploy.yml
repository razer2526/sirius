name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versionar service worker
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/sirius-shell-[^']*/sirius-shell-$SHA/" public/sw.js
          printf '%s' "$SHA" > public/BUILD_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sw.js public/BUILD_VERSION
          git commit -m "chore: versiona sw.js ($SHA) [skip ci]" || echo "sin cambios que versionar"
          git push

      - name: Actualizar repositorio y desplegar en cPanel
        uses: pinkasey/cpanel-deploy-action@v1.0.0
        with:
          hostname: ${{ secrets.CPANEL_HOSTNAME }}
          repository_root: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
          branch: main
          cpanel_username: ${{ secrets.CPANEL_USERNAME }}
          cpanel_token: ${{ secrets.CPANEL_TOKEN }}
