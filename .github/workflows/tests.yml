# Pruebas automáticas de Sirius: corren en cada pull request y a mano.
# No bloquean el despliegue (deploy.yml es independiente), pero un PR en rojo no debería fusionarse.
name: Pruebas

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, curl
      - name: Unitarias y estructurales
        run: php tests/run.php
      - name: Integración (php -S + SQLite temporal)
        run: php tests/api_smoke.php
