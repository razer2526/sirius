; Límite de subida del módulo Archivos (25 MB por archivo + margen para el resto del POST).
; HostGator usa PHP-FPM/suPHP: este archivo se aplica sin reiniciar el servidor,
; pero puede tardar unos minutos en tomar efecto (user_ini.cache_ttl).
; Si no aplica, ajustar desde cPanel > MultiPHP INI Editor.
upload_max_filesize = 26M
post_max_size = 30M
